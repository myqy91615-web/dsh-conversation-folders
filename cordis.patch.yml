# dsh-conversation-folders bundle 层：插入会话专用文件夹插件行。
- insert:
    - id: dsh-conversation-folders
      name: dsh-conversation-folders
      config:
        # 总开关；关闭后停止管理文件夹（已有文件夹与映射不删除）
        enabled: true
        # 会话文件夹名前缀；实际名称形如 会话-<对话标题>（无标题时暂用短 ID）
        folderPrefix: 会话-
        # 对话记录文件名（写在会话文件夹根目录，不会被分类整理移动）
        transcriptName: 对话记录.md
        # 把散落文件按类别分文件夹存放并自动命名（仅在对话空闲后执行）
        categorize: true
        # 自动命名前缀：调研<N>_<原文件名>
        runNamePrefix: 调研
        # 对话空闲多久后才整理（毫秒）；期间有新消息/任务就重新计时；0 表示关闭自动整理
        idleDelayMs: 600000
        # 空闲整理时把短 ID 文件夹改名为对话标题（只改一次）
        renameToTitle: true
        # 归档/改名后保留原路径入口（硬链接 / 目录联接），对话里旧文件链接依旧能直接打开
        keepPaths: true
        # 输出目录功能开关：整理后把生产文件（调研<N>_*）复制到 <输出目录>/<会话文件夹名>/
        # （默认开；弹窗默认不自动弹，见下一条）
        chooseOutputDir: true
        # 对话第一次开始时自动弹出「选择储存位置」的系统目录选择框（默认 false）：
        # 不自动弹，需要时在侧栏「会话文件夹」面板点「选择输出目录」或调接口手动弹出；
        # 设为 true 恢复「新对话首次发消息时自动弹一次」
        autoPromptOutputDir: false
        # 删除会话后等待会话产物从磁盘消失的最长时间（毫秒）
        deleteTimeoutMs: 12000
